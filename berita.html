<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pengumuman terbaru kelas XI TKJ 1 SMKN 1 Gempol.">
  <title>Pengumuman | XI TKJ 1</title>

  <link rel="icon" type="image/png" href="/assets/img/logo/smkn1gempol.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/news.css">
  <link rel="stylesheet" href="/assets/css/ui-polish.css">
  <link rel="stylesheet" href="/assets/css/color-balance.css">
</head>
<body>
  <nav id="mainNav" class="navbar navbar-expand-lg fixed-top is-scrolled">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img class="nav-logo" src="/assets/img/logo/smkn1gempol.png" alt="Logo SMKN 1 Gempol" onerror="this.src='/assets/img/logo/default-avatar.png'">
        <span class="brand-text">XI TKJ <span class="text-primary-custom">1</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Buka navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="navbarNav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="/#home">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/berita">Pengumuman</a></li>
          <li class="nav-item"><a class="nav-link" href="/#tentang">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="/#siswa">Siswa</a></li>
          <li class="nav-item"><a class="nav-link" href="/#galeri">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="/#kontak">Sosmed</a></li>
          <li class="nav-item"><a class="nav-link navbar-admin-link" href="/admin" aria-label="Admin" title="Admin"><i class="fa-solid fa-user-shield"></i></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <header class="news-page-header">
      <div class="container">
        <h1><i class="fa-solid fa-bullhorn"></i> Pengumuman</h1>
        <p>Informasi terbaru seputar kelas XI TKJ 1</p>
      </div>
    </header>

    <section class="section section-offwhite">
      <div class="container">
        <div class="news-filter-tabs" id="newsFilterTabs"></div>
        <div id="newsListContainer"><div class="empty-state">Memuat berita...</div></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; <span id="currentYear"></span> XI TKJ 1 · SMKN 1 Gempol</div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top is-visible" type="button" aria-label="Kembali ke atas"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/news.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("currentYear").textContent = new Date().getFullYear();
      const backToTop = document.getElementById("backToTop");
      window.addEventListener("scroll", () => {
        backToTop.classList.toggle("is-visible", window.scrollY > 400);
      }, { passive: true });
      backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    });
  </script>
</body>
</html>
